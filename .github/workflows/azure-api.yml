# Azure App Service deployment — API (existing Web App)
# Repo: https://github.com/M7MDGAMERG/E-Commerce-Intelligence-Platform
#
# If Deployment Center already created a workflow, keep ONE workflow only.
# The publish-profile secret name is set automatically by Azure — check
# GitHub → Settings → Secrets → Actions if deploy fails.

name: Build and deploy API to Azure Web App

# Manual backup only — Azure Deployment Center uses main_e-commerce-intelligence-platform.yml
on:
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: E-Commerce-Intelligence-Platform
  PYTHON_VERSION: '3.11'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      - name: Run tests
        run: |
          source antenv/bin/activate
          python -m pytest tests/ -v --ignore=tests/test_airflow_structure.py

      - name: Verify bootstrap database is present
        run: test -f data/economic_stress.db

      - name: Verify bootstrap database has ETL tables
        run: |
          python - <<'PY'
          import sqlite3
          conn = sqlite3.connect("data/economic_stress.db")
          tables = {
              row[0]
              for row in conn.execute(
                  "SELECT name FROM sqlite_master WHERE type='table'"
              )
          }
          required = {"countries", "stress_scores", "economic_data", "indicators"}
          missing = sorted(required - tables)
          if missing:
              raise SystemExit(
                  "Bootstrap DB is missing tables: "
                  + ", ".join(missing)
                  + ". Run scripts/run_etl_local.bat locally, then "
                  + "scripts/push_db_to_azure.bat"
              )
          countries = conn.execute("SELECT COUNT(*) FROM countries").fetchone()[0]
          scores = conn.execute("SELECT COUNT(*) FROM stress_scores").fetchone()[0]
          if countries == 0 or scores == 0:
              raise SystemExit(
                  f"Bootstrap DB is empty (countries={countries}, stress_scores={scores}). "
                  "Run ETL before pushing."
              )
          print(f"Bootstrap DB OK: {countries} countries, {scores} stress scores")
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !venv/
            !.venv/
            !data/raw/
            !data/processed/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: Production
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Deploy to Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_ECOMMERCEINTELLIGENCEPLATFORM }}
